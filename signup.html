<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Account | Tamil Virundhu</title><meta name="description" content="Create a Tamil Virundhu client account."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"></head>
<body><main class="auth"><section class="auth-card"><div class="top-row"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-bowl-food"></i></span>Tamil Virundhu</a></div><span class="eyebrow">Client portal</span><h1 class="section-title">Create your account.</h1><form action="dashboard.html" method="get"><div class="name-fields"><label>First name<input class="field" type="text" placeholder="First name" required></label><label>Last name<input class="field" type="text" placeholder="Last name" required></label></div><label>Email address<input class="field" type="email" placeholder="you@example.com" required></label><label>Phone number<input class="field" type="tel" placeholder="+91 98765 43210" required></label><label>Password<div class="password-field"><input class="field" type="password" placeholder="••••••••" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></label><label>Confirm password<div class="password-field"><input class="field" type="password" placeholder="••••••••" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></label><button class="button primary auth-submit" type="submit">Create account</button></form><div class="auth-divider"><span>or sign up with</span></div><div class="auth-socials">
     <button type="button" class="social-btn" aria-label="Continue with Google">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.65l3.15-3.15C17.46 2.98 14.97 2 12 2 7.7 2 3.99 4.47 2.18 7.07l2.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
    </button>

    <!-- Facebook -->
    <button type="button" class="social-btn" aria-label="Continue with Facebook">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#1877F2" d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073c0 6.019 4.388 11.008 10.125 11.927v-8.438H7.078v-3.489h3.047V9.41c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.489h-2.796V24C19.612 23.081 24 18.092 24 12.073z"/>

    </button>

    <!-- Apple -->
    <button type="button" class="social-btn" aria-label="Continue with Apple">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#000000" d="M16.365 1.43c0 1.14-.414 2.176-1.104 3.108-.828 1.035-2.07 1.863-3.313 1.76-.138-1.173.414-2.313 1.104-3.108.759-.897 2.07-1.69 3.313-1.76zm4.209 16.565c-.621 1.38-.897 1.966-1.69 3.176-1.104 1.69-2.656 3.797-4.588 3.797-1.69 0-2.138-1.104-4.243-1.104-2.07 0-2.587 1.104-4.243 1.104-1.932 0-3.416-1.897-4.52-3.59C-1.172 17.615-.345 11.65 2.62 8.962c1.449-1.311 3.313-2.104 5.039-2.104 1.794 0 2.932 1.173 4.416 1.173 1.449 0 2.346-1.173 4.381-1.173 1.553 0 3.209.828 4.657 2.277-3.865 2.139-3.244 7.661-.539 8.86z"/>
        </svg>
    </button>
</div><p>Already have an account? <a href="login.html">Sign in</a></p></section></main><script src="assets/js/script.js"></script><script>document.querySelectorAll('.password-toggle').forEach(button=>button.addEventListener('click',()=>{const input=button.previousElementSibling;input.type=input.type==='password'?'text':'password';button.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password');}));window.initSitePreferences();</script></body></html>
