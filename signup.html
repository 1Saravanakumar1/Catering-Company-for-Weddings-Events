<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Account | Tamil Virundhu</title><meta name="description" content="Create a Tamil Virundhu client account."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"></head>
<body><main class="auth"><section class="auth-card"><div class="top-row"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-bowl-food"></i></span>Tamil Virundhu</a></div><span class="eyebrow">Client portal</span><h1 class="section-title">Create your account.</h1><form action="dashboard.html" method="get"><div class="name-fields"><label>First name<input class="field" type="text" placeholder="First name" required></label><label>Last name<input class="field" type="text" placeholder="Last name" required></label></div><label>Email address<input class="field" type="email" placeholder="you@example.com" required></label><label>Phone number<input class="field" type="tel" placeholder="+91 98765 43210" required></label><label>Password<div class="password-field"><input class="field" type="password" placeholder="••••••••" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></label><label>Confirm password<div class="password-field"><input class="field" type="password" placeholder="••••••••" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></label><button class="button primary auth-submit" type="submit">Create account</button></form><div class="auth-divider"><span>or sign up with</span></div><div class="auth-socials"><button class="social-btn" type="button" aria-label="Continue with Google"><i class="fa-brands fa-google"></i></button><button class="social-btn" type="button" aria-label="Continue with Facebook"><i class="fa-brands fa-facebook-f"></i></button><button class="social-btn" type="button" aria-label="Continue with Gmail"><i class="fa-solid fa-envelope"></i></button></div><p>Already have an account? <a href="login.html">Sign in</a></p></section></main><script src="assets/js/script.js"></script><script>document.querySelectorAll('.password-toggle').forEach(button=>button.addEventListener('click',()=>{const input=button.previousElementSibling;input.type=input.type==='password'?'text':'password';button.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password');}));window.initSitePreferences();</script></body></html>
